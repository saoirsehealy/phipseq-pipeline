# =============================================================================
# Everything the PhIP-seq pipeline needs, on any Linux server, without root.
#
#   conda env create -f environment.yml
#   conda activate phipseq
#
# or let bootstrap.sh do it and tell you the interpreter path to paste into
# the GUI's "Python to run them with" field.
#
# BLAST+ comes from bioconda, which is the reason this is a conda env and not a
# requirements.txt: blastp, tblastn and makeblastdb are not pip-installable,
# and stage two shells out to all three.
#
# Lower bounds, not pins. The versions in the comments are what the results in
# this folder were produced with on zeta (python 3.12.2), so they are the
# known-good set to fall back to if a future release breaks something.
# =============================================================================
name: phipseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10          # 3.12.2 on zeta
  - pandas >=2.0           # 2.2.3
  - numpy >=1.24           # 2.2.1
  - matplotlib-base >=3.7  # 3.10.0
  - scipy >=1.10           # 1.15.0
  - blast >=2.14           # 2.15.0+
  # efetch, for fetch_references.sh. Zeta has this at /software/edirect-v23.4,
  # which is why the old setup script would not run anywhere else.
  - entrez-direct >=16     # 23.4 on zeta
  # The GUI needs this only on the machine the browser talks to, not on the
  # analysis server. Harmless to have in both places.
  - paramiko >=3.0
